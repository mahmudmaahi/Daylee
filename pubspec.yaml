name: daylee
description: "DayLee — a private daily companion: expense tracking with cash and online wallets, prayer times and reminders, and local weather."
publish_to: 'none'
repository: https://github.com/mahmudmaahi/Daylee
issue_tracker: https://github.com/mahmudmaahi/Daylee/issues

# Single source of truth for the app version: <name>+<build number>.
# Use `dart run tool/bump_version.dart patch|minor|major` to change it.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── State Management & Routing ─────────────────────────────
  get: ^4.6.6

  # ── Local Database ─────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # ── Lightweight Settings Storage ───────────────────────────
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^4.1.0
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  image: ^4.5.4

  # ── UI & Typography ────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Utility ────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.4.2

  # ── Feature Packages ───────────────────────────────────────
  fl_chart: ^0.69.0            # Charts for Money Management
  geolocator: ^14.0.2
  http: ^1.6.0
  adhan: ^2.0.0+1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Fonts handled via google_fonts package (no local font files needed)

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  remove_alpha_ios: true
  adaptive_icon_background: '#F5F6FA'
  adaptive_icon_foreground: assets/images/logo.png

flutter_native_splash:
  # Same colour as the in-app splash so the hand-over is seamless.
  color: '#0E0A1F'
  image: assets/images/logo.png
  color_dark: '#0E0A1F'
  image_dark: assets/images/logo.png
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    color: '#0E0A1F'
    image: assets/images/logo.png
    icon_background_color: '#0E0A1F'
